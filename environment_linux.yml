name: linux-viewer
channels:
  - defaults
dependencies:
  - python=3.11        # 3.12+ has known issues with pytables on Windows
  - pandas>=2.0
  - pytables>=3.8      # required for pd.read_hdf()
  - h5py>=3.10         # used for writing HDF5 output only
  - tk                 # tkinter folder-picker dialog (included with Python on conda)
  - pip
  - pip:
    - plotly>=5.20     # not on defaults channel, install via pip
    - streamlit>=1.35
